[package]
name = "mock-mpc"
description = "TEST-ONLY mock of the NEAR MPC signer (v3.18.0 wire shapes) for OmniBounty sandbox cross-contract tests. Never deployed outside sandbox."
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.1.0"
borsh = "=1.5.1"
hex = "=0.4.3"
k256 = { version = "=0.13.3", default-features = false, features = ["ecdsa"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
